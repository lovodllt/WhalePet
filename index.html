<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; media-src 'self' blob:">
  <title>Dworld 桌面伙伴</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="bubble" aria-label="人物对白" hidden>
    <div id="bubble-text"></div>
    <button id="bubble-close" class="close" aria-label="收起气泡"><svg viewBox="0 0 24 24" aria-hidden="true" class="icon"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
  </section>
  <section id="chat" class="surface" aria-label="与 deepseek酱 聊天" hidden>
    <header>
      <img class="portrait" src="assets/character.png" alt="">
      <div class="identity"><strong>deepseek酱</strong><span id="connection">连接中</span></div>
      <button id="chat-close" class="close" aria-label="收起聊天"><svg viewBox="0 0 24 24" aria-hidden="true" class="icon"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    </header>
    <div id="history" aria-live="polite"><div class="empty"><svg viewBox="0 0 24 24" aria-hidden="true" class="icon"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/></svg><p>和她说说话</p></div></div>
    <form id="form">
      <div class="composer"><textarea id="input" placeholder="想说什么…" rows="2" maxlength="4000" aria-label="消息"></textarea>
        <div class="compose-actions">
          <button type="button" id="record" title="开始或结束一次录音"><svg viewBox="0 0 24 24" aria-hidden="true" class="icon"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg><span>录音</span></button>
          <button type="button" id="handsfree" title="开启或关闭持续收音"><svg viewBox="0 0 24 24" aria-hidden="true" class="icon"><path d="M3 10v4m4-8v12m5-16v20m5-16v12m4-8v4"/></svg><span>免提</span></button>
          <span id="mic-label" hidden>文字输入</span>
          <button id="send" type="submit" aria-label="发送消息"><svg viewBox="0 0 24 24" aria-hidden="true" class="icon"><path d="m22 2-7 20-4-9-9-4 20-7ZM22 2 11 13"/></svg></button>
        </div>
      </div>
    </form>
  </section>
  <div id="avatar" data-state="idle" data-phase="awake" tabindex="0" role="button" aria-label="左键互动，右键展开功能" aria-controls="toolbar" aria-expanded="false"><div id="character-art"><canvas id="character" width="192" height="208" role="img" aria-label="deepseek酱"></canvas><img id="basin" src="assets/basin.svg" alt="" hidden></div></div>
  <nav id="toolbar" aria-label="人物快捷功能" hidden>
    <button id="chat-toggle" title="聊天" aria-label="聊天"><svg viewBox="0 0 24 24" aria-hidden="true" class="icon"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/></svg></button>
    <button id="look" title="允许观察" aria-label="允许观察" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" class="icon"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button id="quick-mic" title="开启持续听" aria-label="开启持续听" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" class="icon"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg></button>
    <button id="quick-roam" title="自由移动" aria-label="自由移动" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" class="icon"><circle cx="12" cy="12" r="8.5"/><path d="m8 15 2-5 5-2-2 5-5 2Z"/></svg></button>
    <button id="settings-open" title="设置" aria-label="设置"><svg viewBox="0 0 24 24" aria-hidden="true" class="icon"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l1.7-1.3-1.5-2.6-2 .8a7 7 0 0 0-1.7-1L15 4h-3l-.4 2.9a7 7 0 0 0-1.7 1l-2-.8-1.5 2.6L8.1 11a7 7 0 0 0 0 2l-1.7 1.3 1.5 2.6 2-.8a7 7 0 0 0 1.7 1L12 20h3l.4-2.9a7 7 0 0 0 1.7-1l2 .8 1.5-2.6-1.7-1.3a7 7 0 0 0 .1-1Z" transform="translate(-1.5 0)"/></svg></button>
  </nav>
  <div id="state-label" role="status" hidden><i></i><span>连接中</span></div>
  <script type="module" src="renderer.mjs"></script>
</body>
</html>
