<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'">
  <title>桌面伙伴设置</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <aside>
    <div class="app-name"><img src="assets/app-icon.png" alt=""><div><strong>桌面伙伴</strong><span>设置</span></div></div>
    <nav role="tablist" aria-label="设置分类">
      <button role="tab" id="tab-appearance" data-tab="appearance" aria-selected="true" aria-controls="appearance"><span class="nav-icon" aria-hidden="true">◉</span>外观</button>
      <button role="tab" id="tab-companion" data-tab="companion" aria-selected="false" aria-controls="companion"><span class="nav-icon" aria-hidden="true">◌</span>陪伴</button>
      <button role="tab" id="tab-voice" data-tab="voice-settings" aria-selected="false" aria-controls="voice-settings"><span class="nav-icon" aria-hidden="true">♫</span>语音</button>
      <button role="tab" id="tab-actions" data-tab="pet-actions" aria-selected="false" aria-controls="pet-actions"><span class="nav-icon" aria-hidden="true">✦</span>互动</button>
    </nav>
    <div class="sidebar-foot"><span class="status-dot"></span>deepseek酱</div>
  </aside>
  <main>
    <header><h1 id="page-title">外观</h1><p id="page-description">大小与行动</p></header>
    <div class="content">
      <fieldset id="appearance" role="tabpanel" aria-labelledby="tab-appearance">
        <div class="character-preview"><img src="assets/character.png" alt="deepseek酱"><div><strong>deepseek酱</strong><p>桌面伙伴</p></div></div>
        <label class="range-row"><span>大小 <output id="scale-value">100%</output></span><input id="scale" aria-label="人物大小" type="range" min=".5" max="1.8" step=".05"><small>立即生效</small></label>
        <label class="setting-row"><span><strong>自由移动</strong><small>在桌面上走动</small></span><input id="roam" type="checkbox" role="switch"></label>
        <label class="setting-row compact"><span>帧率</span><span class="number-unit"><input id="fps" aria-label="帧率" type="number" min="1" max="60">帧/秒</span></label>
      </fieldset>
      <fieldset id="companion" role="tabpanel" aria-labelledby="tab-companion" hidden>
        <label class="setting-row"><span><strong>模式</strong><small>选择观察和发言频率</small></span><select id="mode"><option value="normal">日常</option><option value="companion">积极</option></select></label>
        <label class="setting-row"><span><strong>允许观察</strong><small>立即生效；开启时可能需要系统授权</small></span><input id="observationEnabled" type="checkbox" role="switch"></label>
        <h2>日常</h2>
        <label class="setting-row compact"><span>观察间隔</span><span class="number-unit"><input id="normalCapture" aria-label="日常观察间隔" type="number" min="15" max="86400">秒</span></label>
        <label class="setting-row compact"><span>发言最小间隔</span><span class="number-unit"><input id="normalSpeech" aria-label="日常发言最小间隔" type="number" min="15" max="86400">秒</span></label>
        <h2>积极</h2>
        <label class="setting-row compact"><span>观察间隔</span><span class="number-unit"><input id="companionCapture" aria-label="积极陪伴观察间隔" type="number" min="15" max="86400">秒</span></label>
        <label class="setting-row compact"><span>发言最小间隔</span><span class="number-unit"><input id="companionSpeech" aria-label="积极陪伴发言最小间隔" type="number" min="15" max="86400">秒</span></label>
      </fieldset>
      <fieldset id="voice-settings" role="tabpanel" aria-labelledby="tab-voice" hidden>
        <label class="setting-row"><span><strong>语音回复</strong><small>朗读她的回复</small></span><input id="voice" type="checkbox" role="switch"></label>
        <label class="range-row"><span>音量</span><input id="volume" aria-label="音量" type="range" min="0" max="1" step=".05"></label>
        <label class="setting-row"><span><strong>麦克风</strong></span><select id="microphone"><option value="">系统默认</option></select></label>
        <label class="setting-row"><span><strong>扬声器</strong></span><select id="speaker"><option value="">系统默认</option></select></label>
      </fieldset>
      <fieldset id="pet-actions" role="tabpanel" aria-labelledby="tab-actions" hidden>
        <h2>动作</h2><div id="motion-list" class="motion-list"></div>
        <h2>管理</h2>
        <button id="find-pet" class="action-row" type="button"><span>找回<small>移回屏幕</small></span><span>›</span></button>
        <button id="hide-pet" class="action-row" type="button"><span>隐藏<small>从托盘重新显示</small></span><span>›</span></button>
        <button id="restart-pet" class="action-row" type="button"><span>重启<small>屏幕共享会结束</small></span><span>›</span></button>
        <button id="quit-pet" class="action-row" type="button"><span>退出</span><span>›</span></button>
      </fieldset>
    </div>
    <footer><span>大小立即生效</span><button id="save-settings" class="primary">保存</button></footer>
  </main>
  <script type="module" src="settings.mjs"></script>
</body>
</html>
